<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Echo — Offline Player</title>
<meta name="theme-color" content="#0f0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --ink:#f5efe4; --ink2:#fffaf0; --paper:#0f0e13; --fade:#6b6475; --amber:#b9701f; --wine:#8a3f50; --line:rgba(0,0,0,.1); --shadow:rgba(0,0,0,.18);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#0f0e13; --ink2:#1a1820; --paper:#f3ead9; --fade:#9b93a6; --amber:#e3a23a; --wine:#b5667a; --line:rgba(255,255,255,.09); --shadow:rgba(0,0,0,.5);
  color-scheme: dark;
}}
:root[data-theme="dark"]{
  --ink:#0f0e13; --ink2:#1a1820; --paper:#f3ead9; --fade:#9b93a6; --amber:#e3a23a; --wine:#b5667a; --line:rgba(255,255,255,.09); --shadow:rgba(0,0,0,.5);
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);scroll-padding-top:env(safe-area-inset-top,0);}
body{height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;}
.app{height:100%;display:flex;flex-direction:column;}
.display{font-family:Georgia,'Times New Roman',serif;font-style:italic;}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
.iconBtn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;color:var(--paper);font-size:20px;transition:transform .15s ease,opacity .15s ease;}
.iconBtn:active{transform:scale(.88);opacity:.7;}
.iconBtn svg{width:1em;height:1em;}

/* header */
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;}
.topbar h1{font-size:22px;margin:0;font-weight:600;letter-spacing:.2px;}
.topbar .actions{display:flex;gap:4px;}
.searchWrap{flex:none;padding:0 18px 10px;}
.searchWrap input{width:100%;padding:10px 14px;border-radius:9px;border:1px solid var(--line);background:var(--ink2);color:var(--paper);font-size:14.5px;outline:none;}
.searchWrap input::placeholder{color:var(--fade);}

/* library */
.library{flex:1;overflow-y:auto;padding:0 18px 130px;-webkit-overflow-scrolling:touch;}
.empty{text-align:center;padding:70px 20px 0;color:var(--fade);}
.empty .mark{width:52px;height:52px;margin:0 auto 16px;border-radius:9px;background:linear-gradient(145deg,var(--amber),var(--wine));}
.empty p{margin:0 0 18px;font-size:14.5px;}
.primaryBtn{display:inline-block;padding:11px 20px;border-radius:9px;background:var(--amber);color:#1a1206;font-weight:600;font-size:14px;}
.primaryBtn:active{opacity:.8;}
.row{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);}
.row:active{opacity:.65;}
.swatch{flex:none;width:44px;height:44px;border-radius:7px;background:linear-gradient(150deg,var(--sw1),var(--sw2));}
.rowInfo{flex:1;min-width:0;}
.rowInfo .t{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rowInfo .a{font-size:12.5px;color:var(--fade);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.rowDur{flex:none;font-size:12.5px;color:var(--fade);font-variant-numeric:tabular-nums;padding-left:6px;}
.row.active .t{color:var(--amber);}
.eq{display:flex;align-items:flex-end;gap:2px;width:14px;height:14px;flex:none;}
.eq i{width:3px;background:var(--amber);border-radius:1px;animation:eq 1s ease-in-out infinite;}
.eq i:nth-child(2){animation-delay:.2s;} .eq i:nth-child(3){animation-delay:.4s;}
@keyframes eq{0%,100%{height:3px;}50%{height:13px;}}
.rowAdd{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--fade);font-size:18px;margin-left:2px;}
.rowAdd:active{transform:scale(.85);}
.checkCircle{display:none;flex:none;width:21px;height:21px;border-radius:50%;border:2px solid var(--fade);}
.app.selecting .checkCircle{display:block;}
.app.selecting .rowAdd{display:none;}
.row.selected .checkCircle{background:var(--amber);border-color:var(--amber);}
.iconBtn.on{color:var(--amber);}
.selectBar{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--ink2);border-radius:12px;box-shadow:0 8px 24px var(--shadow);display:none;align-items:center;justify-content:space-between;padding:10px 14px;z-index:21;}
.app.selecting .selectBar{display:flex;}
.app.selecting .miniplayer{display:none;}
.selectBar span{font-size:13.5px;color:var(--fade);}
.selectBar .primaryBtn{padding:9px 16px;font-size:13.5px;transition:opacity .15s;}

/* drawer + sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:38;}
.backdrop.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;background:var(--ink2);z-index:40;transform:translateX(-100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding:calc(env(safe-area-inset-top,0px) + 20px) 0 calc(env(safe-area-inset-bottom,0px) + 16px);overflow-y:auto;box-shadow:12px 0 40px var(--shadow);}
.drawer.open{transform:translateX(0);}
.drawerItem{display:flex;justify-content:space-between;align-items:center;padding:13px 20px;font-size:15px;}
.drawerItem.active{color:var(--amber);}
.drawerItem .count{font-size:12px;color:var(--fade);}
.drawerDivider{padding:18px 20px 6px;font-size:11.5px;letter-spacing:.3px;color:var(--fade);}
.drawerNew{display:block;width:calc(100% - 40px);margin:10px 20px 0;padding:11px;border-radius:9px;border:1px dashed var(--line);color:var(--fade);font-size:14px;text-align:center;}
.plRow{display:flex;align-items:center;}
.plRow .drawerItem{flex:1;}
.plDel{flex:none;font-size:16px;color:var(--fade);width:30px;height:30px;display:flex;align-items:center;justify-content:center;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--ink2);border-radius:16px 16px 0 0;z-index:45;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding:18px 20px calc(env(safe-area-inset-bottom,0px) + 22px);max-height:65vh;overflow-y:auto;}
.sheet.open{transform:translateY(0);}
.sheet h3{margin:0 0 14px;font-size:16px;font-weight:600;}
.sheet .sub{font-size:13px;color:var(--fade);margin:0;}
.plCheck{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);}
.plCheck input{width:19px;height:19px;accent-color:var(--amber);}
.plCheck .name{flex:1;font-size:14.5px;}
.sheetNew{display:block;width:100%;margin-top:14px;padding:11px;border-radius:9px;background:var(--amber);color:#1a1206;font-weight:600;font-size:14px;text-align:center;}

/* mini player */
.miniplayer{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--ink2);border-radius:12px;box-shadow:0 8px 24px var(--shadow);overflow:hidden;transform:translateY(130%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:20;}
.miniplayer.show{transform:translateY(0);}
.miniProgress{height:2px;background:var(--line);}
.miniProgressFill{height:100%;width:0%;background:var(--amber);}
.miniContent{display:flex;align-items:center;gap:11px;padding:9px 10px;}
.miniInfo{flex:1;min-width:0;}
.miniInfo .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.miniInfo .a{font-size:12px;color:var(--fade);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* now playing */
.nowplaying{position:fixed;inset:0;background:#000;transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);z-index:30;overflow:hidden;}
.nowplaying.open{transform:translateY(0);}
.npBg{position:absolute;inset:0;background:linear-gradient(150deg,var(--sw1),var(--sw2));transition:transform 2.4s ease;}
.npBg.playing{animation:breathe 7s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
.npScrimTop{position:absolute;top:0;left:0;right:0;height:130px;background:linear-gradient(to bottom, rgba(0,0,0,.5), transparent);z-index:1;}
.npScrimBottom{position:absolute;bottom:0;left:0;right:0;height:58%;background:linear-gradient(to top, rgba(0,0,0,.85) 15%, rgba(0,0,0,.45) 60%, transparent);z-index:1;}
.npTop{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 0;z-index:2;}
.npTop .iconBtn{color:#fff;}
.npBottom{position:absolute;left:0;right:0;bottom:0;padding:0 26px calc(env(safe-area-inset-bottom,0px) + 28px);z-index:2;color:#fff;}
.npTitle{font-size:27px;font-weight:500;margin:0 0 16px;line-height:1.22;text-shadow:0 2px 14px rgba(0,0,0,.4);}
.seekWrap{padding:0 0 4px;}
.seekWrap input[type=range]{width:100%;accent-color:var(--amber);height:22px;}
.times{display:flex;justify-content:space-between;font-size:11.5px;color:rgba(255,255,255,.75);font-variant-numeric:tabular-nums;margin-top:-4px;}
.npControls{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 0;}
.ctrlBtn{font-size:22px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.8);}
.ctrlBtn.on{color:var(--amber);}
.ctrlBtn:active{transform:scale(.85);}
.playBtn{width:66px;height:66px;border-radius:50%;background:var(--amber);color:#1a1206;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.playBtn:active{transform:scale(.92);}
.playBtn svg{width:1em;height:1em;}

::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:8px;min-width:0;">
      <button class="iconBtn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 class="display" id="headerTitle" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Echo</h1>
    </div>
    <div class="actions">
      <button class="iconBtn" id="searchToggle" aria-label="Search"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.71.71l.27.28v.79l5 5L20.49 19zM10.5 14A4.5 4.5 0 1 1 15 9.5 4.5 4.5 0 0 1 10.5 14z"/></svg></button>
      <button class="iconBtn" id="addBtn" aria-label="Add songs"><svg viewBox="0 0 24 24"><rect x="11" y="4" width="2" height="16" fill="currentColor"/><rect x="4" y="11" width="16" height="2" fill="currentColor"/></svg></button>
      <button class="iconBtn" id="selectToggle" aria-label="Select songs"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 12l3 3 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </header>
  <div class="searchWrap" id="searchWrap" style="display:none;">
    <input id="searchInput" type="text" placeholder="Search your library">
  </div>
  <main class="library" id="library">
    <div class="empty" id="emptyState">
      <div class="mark"></div>
      <p>Nothing here yet. Pull in the songs you've already got on your phone.</p>
      <button class="primaryBtn" id="emptyAddBtn">Add songs</button>
    </div>
    <div id="songList"></div>
  </main>

  <div class="selectBar" id="selectBar">
    <button class="iconBtn" id="selectCancel" aria-label="Cancel"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg></button>
    <span id="selectCount">0 selected</span>
    <button class="primaryBtn" id="selectAddBtn">Add to Playlist</button>
  </div>

  <div class="miniplayer" id="miniplayer">
    <div class="miniProgress"><div class="miniProgressFill" id="miniProgressFill"></div></div>
    <div class="miniContent" id="miniContent">
      <div class="swatch" id="miniArt" style="width:38px;height:38px;border-radius:6px;"></div>
      <div class="miniInfo"><div class="t" id="miniTitle">—</div><div class="a" id="miniArtist">—</div></div>
      <button class="iconBtn" id="miniPlayBtn"></button>
      <button class="iconBtn" id="miniNextBtn"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
  </div>

  <div class="nowplaying" id="nowplaying">
    <div class="npBg" id="npArt"></div>
    <div class="npScrimTop"></div>
    <div class="npScrimBottom"></div>
    <div class="npTop">
      <button class="iconBtn" id="npClose"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="npBottom">
      <h2 class="display npTitle" id="npTitle">—</h2>
      <div class="seekWrap">
        <input type="range" id="seek" min="0" max="1000" value="0">
        <div class="times"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
      </div>
      <div class="npControls">
        <button class="ctrlBtn" id="shuffleBtn">⤭</button>
        <button class="ctrlBtn" id="prevBtn"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button class="playBtn" id="npPlayBtn"></button>
        <button class="ctrlBtn" id="nextBtn"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        <button class="ctrlBtn" id="repeatBtn">↻</button>
      </div>
    </div>
  </div>

  <div class="backdrop" id="drawerBackdrop"></div>
  <div class="drawer" id="drawer">
    <div class="drawerItem active" id="allSongsItem">All Songs<span class="count" id="allCount">0</span></div>
    <div class="drawerDivider">Playlists</div>
    <div id="playlistList"></div>
    <button class="drawerNew" id="newPlaylistBtn">+ New Playlist</button>
  </div>

  <div class="backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="plSheet">
    <h3>Add to playlist</h3>
    <div id="plSheetList"></div>
    <button class="sheetNew" id="sheetNewBtn">+ New Playlist</button>
  </div>

  <input type="file" id="fileInput" accept="audio/*" multiple hidden>
  <audio id="audio" preload="metadata"></audio>
</div>

<script>
const PLAY='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
let db, songs=[], filtered=[], queue=[], curIdx=-1, shuffleOn=false, repeatMode='off', curSong=null, curUrl=null;
let playlists=[], currentPlaylistId=null, sheetSongIds=[];
let selecting=false, selectedIds=new Set();

const $=id=>document.getElementById(id);
const audio=$('audio');

function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('echoMusicDB',2);
  r.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains('songs')) d.createObjectStore('songs',{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains('playlists')) d.createObjectStore('playlists',{keyPath:'id',autoIncrement:true});
  };
  r.onsuccess=e=>{db=e.target.result;res();}; r.onerror=e=>rej(e);
});}
function dbAdd(s){return new Promise((res,rej)=>{const tx=db.transaction('songs','readwrite');const rq=tx.objectStore('songs').add(s);rq.onsuccess=()=>res(rq.result);rq.onerror=e=>rej(e);});}
function dbPut(s){return new Promise((res,rej)=>{const tx=db.transaction('songs','readwrite');tx.objectStore('songs').put(s);tx.oncomplete=()=>res();tx.onerror=e=>rej(e);});}
function dbAll(){return new Promise((res,rej)=>{const tx=db.transaction('songs','readonly');const rq=tx.objectStore('songs').getAll();rq.onsuccess=()=>res(rq.result);rq.onerror=e=>rej(e);});}
function plAdd(p){return new Promise((res,rej)=>{const tx=db.transaction('playlists','readwrite');const rq=tx.objectStore('playlists').add(p);rq.onsuccess=()=>res(rq.result);rq.onerror=e=>rej(e);});}
function plPut(p){return new Promise((res,rej)=>{const tx=db.transaction('playlists','readwrite');tx.objectStore('playlists').put(p);tx.oncomplete=()=>res();tx.onerror=e=>rej(e);});}
function plDel(id){return new Promise((res,rej)=>{const tx=db.transaction('playlists','readwrite');tx.objectStore('playlists').delete(id);tx.oncomplete=()=>res();tx.onerror=e=>rej(e);});}
function plAll(){return new Promise((res,rej)=>{const tx=db.transaction('playlists','readonly');const rq=tx.objectStore('playlists').getAll();rq.onsuccess=()=>res(rq.result);rq.onerror=e=>rej(e);});}

function hue(str){let h=0;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))%360;return h;}
function swatchCss(title){const h=hue(title);return {sw1:`hsl(${h} 55% 42%)`,sw2:`hsl(${(h+42)%360} 60% 28%)`};}
function fmt(t){if(!isFinite(t))return'0:00';const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s;}
function parseMeta(name){const base=name.replace(/\.[^.]+$/,'');const parts=base.split(' - ');if(parts.length>=2)return{artist:parts[0].trim(),title:parts.slice(1).join(' - ').trim()};return{artist:'Unknown artist',title:base};}
function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function renderList(){
  const isEmpty = filtered.length===0;
  $('emptyState').style.display = isEmpty ? 'block':'none';
  if(isEmpty){
    const p=$('emptyState').querySelector('p');
    if(currentPlaylistId==null){ p.textContent="Nothing here yet. Pull in the songs you've already got on your phone."; $('emptyAddBtn').style.display='inline-block'; }
    else { p.textContent = songs.length ? "No songs in this playlist yet. Tap the + on a song in All Songs to add it here." : "Add some songs first, then drop them into this playlist."; $('emptyAddBtn').style.display='none'; }
  }
  const list=$('songList');
  list.innerHTML = filtered.map(s=>{
    const sw=swatchCss(s.title);
    const active = curSong && curSong.id===s.id;
    const sel = selecting && selectedIds.has(s.id);
    const eq = active && !selecting && !audio.paused ? `<div class="eq"><i></i><i></i><i></i></div>` : '';
    return `<div class="row${active?' active':''}${sel?' selected':''}" data-id="${s.id}" style="--sw1:${sw.sw1};--sw2:${sw.sw2}">
      <div class="checkCircle"></div>
      <div class="swatch"></div>
      <div class="rowInfo"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}</div></div>
      ${eq}<div class="rowDur">${s.duration?fmt(s.duration):''}</div>
      <button class="rowAdd" data-addid="${s.id}">+</button>
    </div>`;
  }).join('');
  list.querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>{
    const id=Number(r.dataset.id);
    if(selecting) toggleSelect(id); else playById(id);
  }));
  list.querySelectorAll('.rowAdd').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openPlaylistSheet(Number(b.dataset.addid));}));
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function baseSongs(){
  if(currentPlaylistId==null) return songs.slice();
  const pl=playlists.find(p=>p.id===currentPlaylistId);
  if(!pl) return [];
  return pl.songIds.map(id=>songs.find(s=>s.id===id)).filter(Boolean);
}
function applyFilter(){
  const q=$('searchInput').value.trim().toLowerCase();
  const base=baseSongs();
  filtered = q ? base.filter(s=>(s.title+' '+s.artist).toLowerCase().includes(q)) : base;
  renderList();
}
function renderHeaderTitle(){
  $('headerTitle').textContent = currentPlaylistId==null ? 'Echo' : (playlists.find(p=>p.id===currentPlaylistId)?.name || 'Playlist');
}
function renderDrawer(){
  $('allCount').textContent = songs.length;
  $('allSongsItem').classList.toggle('active', currentPlaylistId==null);
  const list=$('playlistList');
  list.innerHTML = playlists.map(p=>`
    <div class="plRow">
      <div class="drawerItem${currentPlaylistId===p.id?' active':''}" data-pl="${p.id}">${esc(p.name)}<span class="count">${p.songIds.length}</span></div>
      <button class="plDel" data-del="${p.id}">✕</button>
    </div>`).join('');
  list.querySelectorAll('[data-pl]').forEach(el=>el.addEventListener('click',()=>selectPlaylist(Number(el.dataset.pl))));
  list.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();deletePlaylist(Number(el.dataset.del));}));
}
function openDrawer(){$('drawer').classList.add('open');$('drawerBackdrop').classList.add('open');}
function closeDrawer(){$('drawer').classList.remove('open');$('drawerBackdrop').classList.remove('open');}
function selectPlaylist(id){ currentPlaylistId=id; closeDrawer(); renderHeaderTitle(); applyFilter(); renderDrawer(); }
async function deletePlaylist(id){
  if(!confirm('Delete this playlist? Songs stay in your library.')) return;
  await plDel(id); playlists=playlists.filter(p=>p.id!==id);
  if(currentPlaylistId===id){ currentPlaylistId=null; renderHeaderTitle(); }
  applyFilter(); renderDrawer();
}
async function createPlaylist(name){
  name=(name||'').trim(); if(!name) return null;
  const rec={name, songIds:[], createdAt:Date.now()};
  const id=await plAdd(rec); rec.id=id; playlists.push(rec);
  return rec;
}
function openPlaylistSheet(ids){ sheetSongIds = Array.isArray(ids) ? ids : [ids]; renderSheetList(); $('plSheet').classList.add('open'); $('sheetBackdrop').classList.add('open'); }
function closeSheet(){
  $('plSheet').classList.remove('open'); $('sheetBackdrop').classList.remove('open');
  if(sheetSongIds.length>1) setSelecting(false);
}
function renderSheetList(){
  const list=$('plSheetList');
  const n=sheetSongIds.length;
  const hint = n>1 ? `<p class="sub">${n} songs selected</p>` : '';
  if(!playlists.length){ list.innerHTML=hint+'<p class="sub">No playlists yet — make one below.</p>'; return; }
  list.innerHTML = hint + playlists.map(p=>{
    const allIn = sheetSongIds.every(id=>p.songIds.includes(id));
    return `<label class="plCheck">
      <input type="checkbox" data-plid="${p.id}" ${allIn?'checked':''}>
      <span class="name">${esc(p.name)}</span>
    </label>`;
  }).join('');
  list.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change', async e=>{
    const pid=Number(e.target.dataset.plid); const pl=playlists.find(p=>p.id===pid);
    if(e.target.checked){ sheetSongIds.forEach(id=>{ if(!pl.songIds.includes(id)) pl.songIds.push(id); }); }
    else { pl.songIds = pl.songIds.filter(id=>!sheetSongIds.includes(id)); }
    await plPut(pl); renderDrawer(); if(currentPlaylistId!=null) applyFilter();
  }));
}
function setSelecting(on){
  selecting=on; if(!on) selectedIds.clear();
  document.querySelector('.app').classList.toggle('selecting', on);
  $('selectToggle').classList.toggle('on', on);
  renderList(); updateSelectBar();
}
function toggleSelect(id){
  if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  renderList(); updateSelectBar();
}
function updateSelectBar(){
  const n=selectedIds.size;
  $('selectCount').textContent = n + ' selected';
  $('selectAddBtn').style.opacity = n? '1':'.4';
  $('selectAddBtn').style.pointerEvents = n? 'auto':'none';
}

function buildQueue(){queue = shuffleOn ? shuffleArr(filtered) : filtered.slice();}
function playById(id){
  const s = filtered.find(x=>x.id===id); if(!s) return;
  if(!queue.length || !queue.some(q=>q.id===id)) buildQueue();
  curIdx = queue.findIndex(q=>q.id===id);
  load(queue[curIdx]);
}
function load(s){
  if(curUrl) URL.revokeObjectURL(curUrl);
  curUrl = URL.createObjectURL(s.blob);
  audio.src = curUrl; curSong = s;
  const sw = swatchCss(s.title);
  [$('npArt'),$('miniArt')].forEach(el=>{el.style.setProperty('--sw1',sw.sw1);el.style.setProperty('--sw2',sw.sw2);});
  $('npTitle').textContent=s.title;
  $('miniTitle').textContent=s.title; $('miniArtist').textContent=s.artist;
  $('miniplayer').classList.add('show');
  audio.play();
  if('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({title:s.title, artist:s.artist, album:'Echo'});
  renderList();
}
function nextTrack(){
  if(!queue.length) return;
  if(curIdx < queue.length-1) curIdx++; else if(repeatMode==='all') curIdx=0; else {audio.pause(); return;}
  load(queue[curIdx]);
}
function prevTrack(){
  if(audio.currentTime>3){audio.currentTime=0;return;}
  if(curIdx>0) curIdx--; else curIdx=0;
  load(queue[curIdx]);
}

audio.addEventListener('loadedmetadata',()=>{
  if(curSong && !curSong.duration){curSong.duration=audio.duration; dbPut(curSong); const inList=songs.find(s=>s.id===curSong.id); if(inList) inList.duration=audio.duration; renderList();}
  $('durTime').textContent=fmt(audio.duration);
});
audio.addEventListener('timeupdate',()=>{
  if(!audio.duration) return;
  const pct=audio.currentTime/audio.duration;
  $('seek').value=Math.round(pct*1000);
  $('curTime').textContent=fmt(audio.currentTime);
  $('miniProgressFill').style.width=(pct*100)+'%';
});
audio.addEventListener('ended',()=>{ if(repeatMode==='one'){audio.currentTime=0;audio.play();} else nextTrack(); });
audio.addEventListener('play',()=>{setPlayIcons(true);$('npArt').classList.add('playing');renderList();if('mediaSession'in navigator)navigator.mediaSession.playbackState='playing';});
audio.addEventListener('pause',()=>{setPlayIcons(false);$('npArt').classList.remove('playing');renderList();if('mediaSession'in navigator)navigator.mediaSession.playbackState='paused';});
function setPlayIcons(playing){$('npPlayBtn').innerHTML = playing?PAUSE:PLAY; $('miniPlayBtn').innerHTML = playing?PAUSE:PLAY;}
setPlayIcons(false);

$('seek').addEventListener('input',e=>{ if(audio.duration) audio.currentTime = (e.target.value/1000)*audio.duration; });
$('npPlayBtn').addEventListener('click',()=>{ if(!curSong)return; audio.paused?audio.play():audio.pause(); });
$('miniPlayBtn').addEventListener('click',()=>{ if(!curSong)return; audio.paused?audio.play():audio.pause(); });
$('nextBtn').addEventListener('click',nextTrack);
$('prevBtn').addEventListener('click',prevTrack);
$('miniNextBtn').addEventListener('click',e=>{e.stopPropagation();nextTrack();});
$('shuffleBtn').addEventListener('click',()=>{shuffleOn=!shuffleOn; $('shuffleBtn').classList.toggle('on',shuffleOn); const cur=queue[curIdx]; buildQueue(); if(cur) curIdx=queue.findIndex(q=>q.id===cur.id);});
$('repeatBtn').addEventListener('click',()=>{ repeatMode = repeatMode==='off'?'all':repeatMode==='all'?'one':'off'; const b=$('repeatBtn'); b.classList.toggle('on',repeatMode!=='off'); b.textContent = repeatMode==='one'?'↻¹':'↻'; });

$('miniContent').addEventListener('click',e=>{ if(e.target.closest('button')) return; $('nowplaying').classList.add('open'); });
$('npClose').addEventListener('click',()=>$('nowplaying').classList.remove('open'));

$('searchToggle').addEventListener('click',()=>{ const w=$('searchWrap'); w.style.display = w.style.display==='none'?'block':'none'; if(w.style.display==='block') $('searchInput').focus(); });
$('searchInput').addEventListener('input', applyFilter);

$('menuBtn').addEventListener('click', openDrawer);
$('drawerBackdrop').addEventListener('click', closeDrawer);
$('allSongsItem').addEventListener('click',()=>{ currentPlaylistId=null; closeDrawer(); renderHeaderTitle(); applyFilter(); renderDrawer(); });
$('newPlaylistBtn').addEventListener('click', async ()=>{ const name=prompt('Playlist name'); if(name&&name.trim()){ await createPlaylist(name); renderDrawer(); } });
$('sheetBackdrop').addEventListener('click', closeSheet);
$('sheetNewBtn').addEventListener('click', async ()=>{
  const name=prompt('Playlist name'); if(!name||!name.trim()) return;
  const pl=await createPlaylist(name); sheetSongIds.forEach(id=>pl.songIds.push(id)); await plPut(pl);
  renderDrawer(); renderSheetList(); if(currentPlaylistId!=null) applyFilter();
});

$('selectToggle').addEventListener('click', ()=>setSelecting(!selecting));
$('selectCancel').addEventListener('click', ()=>setSelecting(false));
$('selectAddBtn').addEventListener('click', ()=>{ if(selectedIds.size) openPlaylistSheet([...selectedIds]); });

$('addBtn').addEventListener('click',()=>$('fileInput').click());
$('emptyAddBtn').addEventListener('click',()=>$('fileInput').click());
$('fileInput').addEventListener('change', async e=>{
  const files = Array.from(e.target.files);
  for(const f of files){
    if(songs.some(s=>s.fileName===f.name && s.size===f.size)) continue;
    const meta = parseMeta(f.name);
    const rec = {fileName:f.name, title:meta.title, artist:meta.artist, blob:f, size:f.size, duration:null, addedAt:Date.now()};
    const id = await dbAdd(rec); rec.id=id; songs.unshift(rec);
  }
  applyFilter(); renderDrawer();
  e.target.value='';
});

if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play',()=>audio.play());
  navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack',prevTrack);
  navigator.mediaSession.setActionHandler('nexttrack',nextTrack);
  navigator.mediaSession.setActionHandler('seekto',d=>{ if(d.seekTime!=null && audio.duration) audio.currentTime=d.seekTime; });
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}

(async function init(){
  await openDB();
  songs = (await dbAll()).sort((a,b)=>b.addedAt-a.addedAt);
  playlists = await plAll();
  renderHeaderTitle();
  applyFilter();
  renderDrawer();
})();
</script>
</body>
</html>
